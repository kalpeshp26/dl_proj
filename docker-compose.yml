version: "3.8"

services:
  backend:
    build: .
    container_name: deepretail_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["uvicorn", "src.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    container_name: deepretail_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    command: ["streamlit", "run", "dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
